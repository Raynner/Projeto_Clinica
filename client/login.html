<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Praxis</title>

    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #FDF8F4,
                    #F3F5ED
                );

            color: #2D352B;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 20px;
        }

        .login-card {
            background: #FFFFFF;

            padding: 32px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(40, 75, 45, 0.10);
        }

        .login-card h1 {
            color: #284B2D;
            text-align: center;
            margin-bottom: 10px;
        }

        .login-card p {
            text-align: center;

            color: #596451;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #7A8870;

            border-radius: 6px;

            background: #FFFFFF;

            color: #2D352B;

            font-size: 16px;
        }

        input:focus {
            border-color: #284B2D;
            outline: 2px solid #284B2D;
            outline-offset: 2px;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;

            background: #284B2D;

            color: #FFFFFF;
        }

        button:hover {
            background: #1E3A22;
        }

        button:active {
            background: #162C19;
        }

        button:focus-visible {
            outline: 2px solid #284B2D;
            outline-offset: 2px;
        }

        button:disabled {
            background: #E9EDE3;
            color: #697260;
            cursor: not-allowed;
        }

        #mensagem {
            margin-top: 20px;

            text-align: center;

            min-height: 20px;
        }

        .erro {
            color: #A33630;
        }

        .sucesso {
            color: #365B2D;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Praxis</h1>

            <p>
                Acesse sua conta
            </p>

            <form id="formLogin">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="username"
                    >

                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        autocomplete="current-password"
                    >

                </div>

                <button
                    type="submit"
                    id="btnEntrar"
                >
                    Entrar
                </button>

                <div id="mensagem"></div>

            </form>

        </div>

    </div>

    <script src="/js/auth.js"></script>

    <script>
        const formLogin =
            document.getElementById("formLogin");

        const mensagem =
            document.getElementById("mensagem");

        const btnEntrar =
            document.getElementById("btnEntrar");

        formLogin.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                mensagem.textContent = "";
                mensagem.className = "";

                const email =
                    document.getElementById("email").value;

                const senha =
                    document.getElementById("senha").value;

                btnEntrar.disabled = true;
                btnEntrar.textContent = "Entrando...";

                try {

                    const resposta = await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "X-Praxis-Request": "1"
                            },

                            body: JSON.stringify({
                                email,
                                senha
                            })
                        }
                    );

                    const dados =
                        await resposta.json();

                    if (!resposta.ok) {
                        throw new Error(
                            dados.erro ||
                            "Não foi possível realizar o login."
                        );
                    }

                    // O cookie HttpOnly é recebido automaticamente; não armazena token no JS.
                    // Um POST bem-sucedido não basta: confirma compatibilidade e cookie
                    // para não redirecionar ao login com os campos vazios em caso de falha.
                    const sessao = await confirmarSessaoLogin();

                    mensagem.textContent =
                        "Login realizado com sucesso.";

                    mensagem.className =
                        "sucesso";

                    window.location.href =
                        sessao.trocarSenha ? "/senha.html" : "/index.html";

                } catch (erro) {

                    mensagem.textContent =
                        erro.message;

                    mensagem.className =
                        "erro";

                } finally {

                    btnEntrar.disabled = false;
                    btnEntrar.textContent = "Entrar";
                }
            }
        );
    </script>

</body>

</html>
