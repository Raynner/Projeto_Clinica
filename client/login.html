<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Praxis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            color: white;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 20px;
        }

        .login-card {
            background: #1e293b;

            padding: 32px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-card p {
            text-align: center;

            color: #94a3b8;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #334155;

            border-radius: 6px;

            background: #0f172a;

            color: white;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #38bdf8;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;

            background: #0284c7;

            color: white;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensagem {
            margin-top: 20px;

            text-align: center;

            min-height: 20px;
        }

        .erro {
            color: #f87171;
        }

        .sucesso {
            color: #4ade80;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Praxis</h1>

            <p>
                Acesse sua conta
            </p>

            <form id="formLogin">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="username"
                    >

                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        autocomplete="current-password"
                    >

                </div>

                <button
                    type="submit"
                    id="btnEntrar"
                >
                    Entrar
                </button>

                <div id="mensagem"></div>

            </form>

        </div>

    </div>

    <script src="/js/auth.js"></script>

    <script>
        const formLogin =
            document.getElementById("formLogin");

        const mensagem =
            document.getElementById("mensagem");

        const btnEntrar =
            document.getElementById("btnEntrar");

        formLogin.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                mensagem.textContent = "";
                mensagem.className = "";

                const email =
                    document.getElementById("email").value;

                const senha =
                    document.getElementById("senha").value;

                btnEntrar.disabled = true;
                btnEntrar.textContent = "Entrando...";

                try {

                    const resposta = await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                senha
                            })
                        }
                    );

                    const dados =
                        await resposta.json();

                    if (!resposta.ok) {
                        throw new Error(
                            dados.erro ||
                            "Não foi possível realizar o login."
                        );
                    }

                    salvarToken(dados.token);

                    mensagem.textContent =
                        "Login realizado com sucesso.";

                    mensagem.className =
                        "sucesso";

                    window.location.href =
                        "/index.html";

                } catch (erro) {

                    mensagem.textContent =
                        erro.message;

                    mensagem.className =
                        "erro";

                } finally {

                    btnEntrar.disabled = false;
                    btnEntrar.textContent = "Entrar";
                }
            }
        );
    </script>

</body>

</html>
