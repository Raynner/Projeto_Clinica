<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Paciente</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );

            color: white;

            padding: 40px 20px;
        }


        .container {

            width: 100%;

            max-width: 750px;

            margin: auto;
        }


        .form-card {

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);

            backdrop-filter: blur(10px);
        }


        .header {

            text-align: center;

            margin-bottom: 35px;
        }


        .header h1 {

            font-size: 30px;

            margin-bottom: 10px;

            color: #38bdf8;
        }


        .header p {

            color: #94a3b8;

            font-size: 15px;
        }


        .section-title {

            color: #38bdf8;

            font-size: 20px;

            margin-bottom: 20px;

            padding-bottom: 10px;

            border-bottom: 1px solid
                rgba(255, 255, 255, 0.1);
        }


        .section {

            margin-bottom: 35px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 15px;

            font-weight: bold;

            color: #e2e8f0;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border: 1px solid #334155;

            background: #0f172a;

            color: white;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #38bdf8;

            box-shadow:
                0 0 0 3px
                rgba(56, 189, 248, 0.15);
        }


        .form-group input::placeholder {

            color: #64748b;
        }


        .form-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 30px;
        }


        button {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .btn-cadastrar {

            background: #38bdf8;

            color: #0f172a;
        }


        .btn-cadastrar:hover {

            background: #0ea5e9;

            transform: translateY(-2px);
        }


        .btn-limpar {

            background: #334155;

            color: white;
        }


        .btn-limpar:hover {

            background: #475569;

            transform: translateY(-2px);
        }


        #mensagem {

            margin-top: 25px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            display: none;
        }


        .sucesso {

            display: block !important;

            background:
                rgba(34, 197, 94, 0.15);

            border: 1px solid #22c55e;

            color: #4ade80;
        }


        .erro {

            display: block !important;

            background:
                rgba(239, 68, 68, 0.15);

            border: 1px solid #ef4444;

            color: #f87171;
        }


        @media (max-width: 600px) {

            .form-card {

                padding: 30px 20px;
            }


            .form-row {

                grid-template-columns: 1fr;
            }


            .buttons {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="form-card">


        <div class="header">

            <h1>Cadastro de Paciente</h1>

            <p>
                Cadastre o responsável e os dados
                do paciente.
            </p>

        </div>


        <form id="formPaciente">


            <!-- ======================== -->
            <!-- RESPONSÁVEL -->
            <!-- ======================== -->

            <div class="section">

                <h2 class="section-title">
                    Dados do Responsável
                </h2>


                <div class="form-group">

                    <label for="nomeResponsavel">
                        Nome completo do responsável
                    </label>

                    <input
                        type="text"
                        id="nomeResponsavel"
                        name="nomeResponsavel"
                        placeholder="Digite o nome completo"
                        required
                    >

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="text"
                            id="telefone"
                            name="telefone"
                            placeholder="67 99999-9999"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="endereco">
                            Endereço
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            placeholder="Rua, número"
                            required
                        >

                    </div>


                </div>

            </div>


            <!-- ======================== -->
            <!-- PACIENTE -->
            <!-- ======================== -->

            <div class="section">

                <h2 class="section-title">
                    Dados do Paciente
                </h2>


                <div class="form-group">

                    <label for="nomePaciente">
                        Nome completo do paciente
                    </label>

                    <input
                        type="text"
                        id="nomePaciente"
                        name="nomePaciente"
                        placeholder="Digite o nome completo"
                        required
                    >

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label for="dataNascimento">
                            Data de nascimento
                        </label>

                        <input
                            type="date"
                            id="dataNascimento"
                            name="dataNascimento"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="responsavel">
                            Responsável
                        </label>

                        <input
                            type="text"
                            id="responsavel"
                            name="responsavel"
                            readonly
                        >

                    </div>


                </div>


                <div class="form-group">

                    <label for="convenio">
                        Convênio
                    </label>

                    <select
                        id="idConvenio"
                        name="idConvenio"
                        required>

                        <option value="">
                            Carregando convênios...
                        </option>

                    </select>

                </div>

            </div>


            <!-- BOTÕES -->

            <div class="buttons">

                <button
                    type="submit"
                    class="btn-cadastrar">

                    Cadastrar Paciente

                </button>


                <button
                    type="reset"
                    class="btn-limpar">

                    Limpar

                </button>

            </div>


        </form>


        <div id="mensagem"></div>


    </div>

</div>


<script>


const formulario =
    document.getElementById("formPaciente");


const mensagem =
    document.getElementById("mensagem");


const nomeResponsavel =
    document.getElementById("nomeResponsavel");


const campoResponsavel =
    document.getElementById("responsavel");


// Mostra automaticamente o nome do responsável
// no campo "Responsável" do paciente.

nomeResponsavel.addEventListener(
    "input",
    function() {

        campoResponsavel.value =
            nomeResponsavel.value;

    }
);


// Carrega os convênios do banco

async function carregarConvenios() {

    try {

        const resposta =
            await fetch("/api/convenios");

        if (!resposta.ok) {

            throw new Error(
                "Erro ao buscar convênios."
            );
        }

        const convenios =
            await resposta.json();

        const selectConvenio =
            document.getElementById(
                "idConvenio"
            );

        selectConvenio.innerHTML = `
            <option value="">
                Selecione o convênio
            </option>
        `;

        convenios.forEach(function(convenio) {

            const option =
                document.createElement("option");

            option.value =
                convenio.convenio_id;

            option.textContent =
                convenio.nome_convenio;

            selectConvenio.appendChild(
                option
            );
        });


    } catch (erro) {

        console.error(
            "Erro ao carregar convênios:",
            erro
        );

    }

}


carregarConvenios();


// Envio do formulário

formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const dados = {

            nomeResponsavel:
                document.getElementById(
                    "nomeResponsavel"
                ).value,

            telefone:
                document.getElementById(
                    "telefone"
                ).value,

            endereco:
                document.getElementById(
                    "endereco"
                ).value,

            nomePaciente:
                document.getElementById(
                    "nomePaciente"
                ).value,

            dataNascimento:
                document.getElementById(
                    "dataNascimento"
                ).value,

            idConvenio:
                Number(
                    document.getElementById(
                        "idConvenio"
                ).value
            )

        };


        try {

            const resposta =
                await fetch("/api/pacientes", {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(dados)

                });


            const resultado =
                await resposta.json();


            if (resposta.ok) {

                mensagem.textContent =
                    resultado.mensagem;

                mensagem.className =
                    "sucesso";

                formulario.reset();

                campoResponsavel.value = "";

            } else {

                mensagem.textContent =
                    resultado.erro;

                mensagem.className =
                    "erro";

            }


        } catch (erro) {

            console.error(erro);

            mensagem.textContent =
                "Erro ao conectar com o servidor.";

            mensagem.className =
                "erro";

        }

    }
);

</script>


</body>

</html>
