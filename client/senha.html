<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar senha — Praxis</title>
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        :root { color-scheme: light; }

        /* Mesma paleta e tipografia dos formulários de cadastro do Praxis. */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #FDF8F4, #F3F5ED);
            color: #2D352B;
            font: 16px Arial, Helvetica, sans-serif;
            color-scheme: light;
        }
        main {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: #FFFFFF;
            border: 1px solid #D6DDCE;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(40, 75, 45, 0.10);
            backdrop-filter: blur(10px);
        }
        h1 { margin: 0 0 10px; color: #284B2D; font-size: 30px; text-align: center; }
        #orientacao { margin: 0 0 30px; color: #596451; font-size: 15px; line-height: 1.6; text-align: center; }
        #formSenha label { display: block; margin-top: 22px; color: #2D352B; font-size: 15px; font-weight: bold; }
        #formSenha input {
            width: 100%; padding: 14px 15px; margin-top: 8px;
            font: inherit; color: #2D352B; background: #FFFFFF;
            border: 1px solid #7A8870; border-radius: 10px;
            transition: border-color .2s, box-shadow .2s;
        }
        #formSenha input:focus { outline: none; border-color: #284B2D; box-shadow: 0 0 0 3px rgba(40, 75, 45, 0.15); }
        #limite { color: #596451; font-size: 13px; line-height: 1.5; }
        /* Seletores restritos ao formulário preservam o estilo do botão Sair da navbar. */
        #salvar {
            width: 100%; padding: 14px; margin-top: 30px;
            font: inherit; font-weight: bold; color: #FFFFFF; background: #284B2D;
            border: 0; border-radius: 10px; cursor: pointer;
            transition: background .2s;
        }
        #salvar:hover { background: #1E3A22; }
        #salvar:focus-visible { outline: 2px solid #2D352B; outline-offset: 3px; }
        #salvar:disabled { opacity: .6; cursor: not-allowed; }
        #mensagem { color: #A33630; line-height: 1.5; }
        #mensagem:not(:empty) { padding: 12px; background: #FDEDE8; border: 1px solid #A33630; border-radius: 8px; }
        @media (max-width: 540px) {
            main { margin: 30px 20px; padding: 28px 24px; }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>
    <main>
        <h1>Alterar senha</h1>
        <p id="orientacao">Use uma frase-senha com pelo menos 15 caracteres. Após a alteração, entre novamente em todos os dispositivos.</p>
        <form id="formSenha">
            <label for="atual">Senha atual</label>
            <input id="atual" type="password" autocomplete="current-password" required maxlength="72">
            <label for="nova">Nova senha</label>
            <input id="nova" type="password" autocomplete="new-password" required minlength="15" maxlength="72" aria-describedby="limite">
            <p id="limite">Limite de 72 bytes: letras acentuadas e emojis podem ocupar mais de um byte.</p>
            <label for="confirmacao">Confirme a nova senha</label>
            <input id="confirmacao" type="password" autocomplete="new-password" required minlength="15" maxlength="72">
            <button id="salvar">Alterar senha</button>
            <p id="mensagem" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        (async () => {
            if (!await protegerPagina()) return;
            const sessao = await carregarSessao();
            if (sessao.trocarSenha) document.getElementById('orientacao').textContent = 'Sua senha precisa ser atualizada antes de continuar. Use uma frase-senha com pelo menos 15 caracteres.';
            document.getElementById('formSenha').addEventListener('submit', async event => {
                event.preventDefault();
                const mensagem = document.getElementById('mensagem');
                const botao = document.getElementById('salvar');
                const novaSenha = document.getElementById('nova').value;
                if (novaSenha !== document.getElementById('confirmacao').value) { mensagem.textContent = 'As senhas não coincidem.'; return; }
                if (new TextEncoder().encode(novaSenha).length > 72) { mensagem.textContent = 'A senha deve ocupar até 72 bytes.'; return; }
                botao.disabled = true;
                try {
                    // A senha é enviada somente ao backend de mesma origem; nunca fica em storage.
                    const resposta = await fetchAutenticado('/api/auth/senha', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ senhaAtual: document.getElementById('atual').value, novaSenha })
                    });
                    if (!resposta) return;
                    const dados = await resposta.json();
                    if (!resposta.ok) throw new Error(dados.erro);
                    window.location.href = '/login.html';
                } catch (erro) { mensagem.textContent = erro.message || 'Não foi possível alterar a senha.'; }
                finally { botao.disabled = false; }
            });
        })();
    </script>
</body>
</html>
